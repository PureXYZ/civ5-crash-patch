; Civ V Crash Patch settings (optional).
; Copy this file into the "civprobe" folder inside the game folder. It takes effect the next
; time the game starts. Every value here is the default, so the file changes nothing until
; you edit it. All options: https://github.com/PureXYZ/civ5-crash-patch/blob/main/docs/SETTINGS.md

[probe]
; 0 turns the whole fix off (the DLL then does nothing).
Enabled=1

; --- The fixes ---
; Render command stream fix: spare room for the stream that overflows on busy frames.
CommandStreamSplit=1
; Stop every command stream writer at the end of its array.
CommandStreamCap=1
; Only let the sound engine use sound handles it really handed out.
AudioGuard=1
; Skip the game's own crash-on-quit (a Lua state used after it was closed).
LuaUnrefGuard=1
; Lua garbage collection every 64 MB of database memory used from Lua, spread out so the game
; doesn't pause (LuaGcSliceUs). 0 = off.
LuaGcStepMB=64
; Small allocations go to the mimalloc memory manager, which keeps memory from running out in
; long sessions. 0 = the game's own memory manager.
MiMalloc=1
; Game events that don't fit the game's event queue while a big save loads wait in a spill buffer
; instead of overwriting others (a crash right after loading). 0 = off.
MsgQueueGuard=1

; --- Memory savings (details in docs/SETTINGS.md) ---
; Give back the 178 MB the game reserves at startup for the largest possible map; loading a map
; then reserves only what it needs (~99 MB saved on a Huge map). 0 = off.
MapGridReserve=1
; Keep the game's Lua objects in mimalloc, which gives free space back, instead of a Windows heap
; that never does. 0 = off.
LuaHeapMimalloc=1
; Keep the game database's SQLite memory in mimalloc too, instead of a Windows heap that keeps its
; load-time peak (74 MB more free at 10 minutes in a test with a large mod set). 0 = off.
DbHeapMimalloc=1
; Don't start the intro movie's video player at all (no opening movie or logos): it loads ~75 MB
; of video and Direct3D 9 drivers that stay for the whole session. 1 = only when the game's own
; "Skip intro video" option is on, 0 = off (the movie plays).
SkipIntroPlayer=2

; --- Faster AI turns (details in docs/SETTINGS.md) ---
; Hand the AI its next update every N ms instead of on the game's 100 ms tick. 0 = the game's tick.
GameCoreIntervalMs=10
; Switch the game's small-object allocator off once it is full (it then wastes AI time). 0 = off.
SmallBlockFallback=1
; Work through the AI's queued updates up to N times per frame. 1 = the game's once per frame.
UiQueuePasses=4
; Pace those passes so panning stays smooth: after a long frame, wait until this percent of the
; time has paid it back. Higher = faster AI turns, more stutter. 0 = unpaced.
UiQueueShare=50
; Fewer hitches while panning in AI turns: run the listeners of these redraw events at most every
; N ms, merging the records in between. 0 = off. Set UiTeamMetCoalesceMs=0 if a mod needs to see
; every meeting of two civs (the merged ones only see the last of a burst).
UiDirtyCoalesceMs=250
UiTeamMetCoalesceMs=30000

; --- More textures (details in docs/SETTINGS.md) ---
; How many textures the game can hold at once, at most 32768. Big mod sets fill the game's 12,288,
; and icons then turn black or magenta. Costs 14 MB of memory space. 0 = the game's 12,288.
TextureHandles=16384
; Terrain textures for every map tile, so big maps don't go grey when you scroll: each map gets two
; per tile that isn't deep water, up to this many (the game has 6,144; 22528 is the most and covers
; any map), and its slots past 6,144 are added to TextureHandles. Costs memory space: about
; 40-110 MB on a Huge map, 14 MB (the bigger texture table) on a map the game's own 6,144 cover.
; Lower it if the log warns about low memory. 0 = the game's.
TerrainBaseSlots=22528

; --- Logs ---
; How many game launches' worth of log files to keep in the civprobe folder. 0 = all.
KeepSessions=20
; 1 = also write detailed memory logs (several MB per hour), for bug reports.
Telemetry=0
; Log the C runtime's "Runtime Error" exits (abort, pure virtual calls and others). 0 = off.
CrtFailureLog=1
; If the last game didn't close normally, add what Windows recorded about it to its log. 0 = off.
LastRunCheck=1
; Seconds the game window may not respond before the log records where the game is stuck. 0 = off.
HangSeconds=30
